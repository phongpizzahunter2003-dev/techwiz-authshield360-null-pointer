spring.application.name=authshield360-backend

# Default profile: H2 (no MySQL required to run). Switch with -Dspring-boot.run.profiles=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- AuthShield 360 configuration (non-secret) ---
authshield.signing-key=${AUTHSHIELD_SIGNING_KEY:dev-only-signing-key-change-me-please-32bytes}
authshield.token-ttl-minutes=60
authshield.session-timeout-minutes=30
authshield.upload-dir=${AUTHSHIELD_UPLOAD_DIR:uploads}
authshield.max-upload-bytes=10485760
authshield.cors-allowed-origins=${AUTHSHIELD_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Dev convenience (VĐ-06): returns the OTP in the API response so no paid SMS is needed.
authshield.expose-otp=true

# --- HTTP / multipart ---
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
