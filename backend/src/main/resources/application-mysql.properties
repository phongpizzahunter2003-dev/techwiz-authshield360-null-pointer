# mysql profile — MySQL 8 is the primary target database (BR-12 persistence).
# Secrets come from environment variables only (BR-10).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:authshield360}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# `update` on first provision so the schema is created/aligned from the entities.
# After the first successful boot you may switch to `validate` for drift protection
# (db/schema.sql is the canonical reference DDL).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OTP codes are never returned by the API outside the lab UI.
authshield.expose-otp=false
