# mysql profile — MySQL 8 is the primary target database (BR-12 persistence).
# Secrets come from environment variables only (BR-10).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:authshield360}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# `update` on first provision so the schema is created/aligned from the entities.
# After the first successful boot you may switch to `validate` for drift protection
# (db/schema.sql is the canonical reference DDL).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hibernate dialect. A real MySQL 8 server is auto-detected correctly. MariaDB (for example
# the MySQL server bundled with XAMPP) reports itself as "5.5.5-...-MariaDB", so set
#   DB_DIALECT=org.hibernate.dialect.MariaDBDialect
# to use the MariaDB dialect and avoid the "version 5.5.5 is no longer supported" warning.
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# OTP codes are not returned by the API in a real deployment. For a lab demo where there is
# no real SMS/mail delivery you can run with AUTHSHIELD_EXPOSE_OTP=true to show the code in
# the UI (otherwise read it from the backend log: "[SIMULATED-SMS] ... code=123456").
authshield.expose-otp=${AUTHSHIELD_EXPOSE_OTP:false}
