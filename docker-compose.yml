# AuthShield 360 — Docker Compose lab (UC-14 reproducible reset)
# Provides MySQL 8 (primary), the Spring Boot API and the React frontend.
# Usage:  docker compose up -d      /      docker compose down -v
#
# Secrets are supplied via a local .env file (never committed — BR-10).
version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: authshield-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-authshield360}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - authshield-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: authshield-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-authshield360}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTHSHIELD_SIGNING_KEY: ${AUTHSHIELD_SIGNING_KEY:-change-me-in-env-32-bytes-minimum}
      AUTHSHIELD_CORS_ORIGINS: ${AUTHSHIELD_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: authshield-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "5173:80"

volumes:
  authshield-mysql-data:
